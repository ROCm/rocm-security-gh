# zizmor configuration for rocm-security-gh
# Reference: https://docs.zizmor.sh/configuration/
#
# Shared across every repo this config scans (this is the single
# zizmor.yml used by the `zizmor.yml` reusable workflow for all
# callers, not just this repo). Per-rule ignore lists and tuning live
# under `rules:`. Add suppressions centrally here as
# `<rule-id>: { ignore: [file.yml:line:col] }` so they stay reviewable,
# rather than scattering inline comments across workflows.
rules: {}
