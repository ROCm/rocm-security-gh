# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# Every `rev` is a full commit SHA, because a tag can be moved to different
# code. The `# frozen:` comment names the release; Dependabot reads it to
# bump the SHA and the comment together. `additional_dependencies` are
# installed from PyPI, so each one carries an exact version.

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: e1668fe86af3810fbca72b8653fe478e66a0afdc  # frozen: v3.2.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
        exclude_types: ["image", "jupyter"]
    -   id: check-yaml
    -   id: check-json
        exclude: '\.jsonc$'
    -   id: check-merge-conflict
    -   id: check-added-large-files
    -   id: mixed-line-ending
    -   id: requirements-txt-fixer
-   repo: https://github.com/psf/black
    rev: 05f0a8ce1f71fbb36e1e032d3b518c7b945089a2  # frozen: 25.11.0
    hooks:
    -   id: black

- repo: https://github.com/hukkin/mdformat
  rev: e07e382e3ffaec54080e233ade96a78295881884  # frozen: 0.7.21
  hooks:
  - id: mdformat
    additional_dependencies:
    - mdformat-gfm==1.0.0
    - mdformat-black==0.1.1
    - mdformat-frontmatter==2.1.2

- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: a30f0d816e5062a67d87c8de753cfe499672b959  # frozen: v1.5.5
  hooks:
  - id: forbid-tabs

- repo: https://github.com/rhysd/actionlint
  rev: 0933c147c9d6587653d45fdcb4c497c57a65f9af  # frozen: v1.7.10
  hooks:
    - id: actionlint
      args: [-shellcheck=, -ignore, 'label ".+" is unknown']

- repo: local
  hooks:
  - id: test-file-naming
    name: Enforce *_test.py naming for tests
    entry: "Test files must use the *_test.py naming convention, not test_*.py"
    language: fail
    files: '(^|/)tests/(.*/)?test_[^/]*\.py$'
