name: Gitleaks

on:
  workflow_call:
    inputs:
      scan_mode:
        description: >-
          'changed' (default) scans only commits introduced by the calling
          event; requires a pull_request or push
          event payload and hard-fails otherwise. 'all' scans the full
          repository history and is required for schedule,
          workflow_dispatch, release, and any other event type.
        required: false
        type: string
        default: changed
      report_formats:
        description: >-
          Comma-separated list of gitleaks report formats to produce. Allowed
          values: 'sarif' (default), 'json', 'csv', 'junit'. SARIF outputs are
          uploaded to GitHub code scanning via github/codeql-action/upload-sarif;
          all other formats are uploaded as build artifacts via
          actions/upload-artifact. Example: 'sarif,json'.
        required: false
        type: string
        default: sarif
      scan_path:
        description: >-
          Path (relative to the repository root) to scan. Defaults to '.' so
          the entire superproject checkout is scanned; set to a subdirectory
          (e.g. 'src/' or 'services/api/') to restrict the scan to that
          subtree. The path MUST exist after checkout or the scan job fails.
          Submodules are NOT scanned: the checkout step leaves them
          uninitialized (its default), and each submodule is a separately
          versioned ROCm or third-party repo with its own gitleaks coverage.
          A PR that bumps a submodule SHA surfaces as a one-line change in
          the superproject diff and is reviewable on its own.
        required: false
        type: string
        default: "."
# Deliberately no top-level `permissions:` block. A caller's permissions
# are an upper bound that a reusable workflow can only preserve or
# reduce, never elevate -- so a `permissions: contents: read` block here
# would silently zero out any `security-events: write` a caller grants
# for SARIF uploads, breaking uploads with no obvious error (see
# https://github.com/ROCm/rocm-tests/pull/70). Permissions are
# intentionally left for each caller to define: PR-time callers that
# only request CSV/JSON/JUnit need just `contents: read`; callers that
# request `report_formats: sarif` must additionally grant
# `security-events: write` on their own `uses:` job.

jobs:
  scan:
    name: Gitleaks scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # This job checks out *two* repos: this workflow's own repo (tooling:
      # gitleaks.py, gitleaks.toml) at $GITHUB_WORKSPACE root, and the scan
      # target (the calling repo) into a side directory below. They can't
      # share the workspace root: actions/checkout wipes the *entire*
      # workspace the first time it checks out a path with no pre-existing
      # `.git` there (regardless of `clean:`), so whichever repo lands at
      # root has to be checked out exactly once and first.
      #
      # Tooling goes at root (not the scan target) because `uses: ./path`
      # local action/workflow references -- used elsewhere in this repo's
      # workflows -- resolve relative to $GITHUB_WORKSPACE on disk, not to
      # this repo automatically.
      - name: Checkout security-gh scan tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # job.workflow_repository / job.workflow_sha identify the repo
          # and exact commit that *this* reusable workflow file was called
          # at/from, regardless of which repo called it.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Checkout TheRock's github_actions_api helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gha_load_github_event/gha_set_output/gha_append_step_summary
          # are owned by TheRock, not duplicated here; sparse-checkout
          # keeps this fast since TheRock is a large repo and only this
          # one file is needed.
          repository: ROCm/TheRock
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            build_tools/github_actions/github_actions_api.py
          sparse-checkout-cone-mode: false
          path: .therock
          persist-credentials: false

      - name: Compute checkout fetch-depth
        id: depth
        run: python build_tools/github_actions/compute_pr_depth.py
        env:
          THEROCK_BUILD_TOOLS_DIR: ${{ github.workspace }}/.therock/build_tools

      - name: Checkout scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.depth.outputs.value }}
          path: .scan-target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run gitleaks
        id: scan
        env:
          GITLEAKS_SCAN_MODE: ${{ inputs.scan_mode }}
          GITLEAKS_REPORT_FORMATS: ${{ inputs.report_formats }}
          GITLEAKS_SOURCE_DIR: .scan-target/${{ inputs.scan_path }}
          THEROCK_BUILD_TOOLS_DIR: ${{ github.workspace }}/.therock/build_tools
        run: python build_tools/scan_tools/github_actions/gitleaks.py

      - name: Upload SARIF report to code scanning
        if: always() && steps.scan.outputs.sarif_path != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif_path }}
          category: gitleaks

      - name: Upload non-SARIF reports
        if: always() && steps.scan.outputs.non_sarif_paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-report
          path: ${{ steps.scan.outputs.non_sarif_paths }}
          if-no-files-found: ignore
