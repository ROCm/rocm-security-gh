name: Bandit

on:
  workflow_call:
    inputs:
      scan_mode:
        description: >-
          'changed' (default) scans only Python files modified by the
          calling event (PR commits or push range). 'all' scans every
          .py file under 'scan_path' recursively.
        required: false
        type: string
        default: changed
      report_formats:
        description: >-
          Comma-separated list of bandit report formats to produce.
          Allowed values: 'sarif' (default), 'json', 'csv', 'html',
          'xml', 'yaml', 'txt'. SARIF outputs are uploaded to GitHub
          code scanning via github/codeql-action/upload-sarif; all
          other formats are uploaded as build artifacts via
          actions/upload-artifact. Example: 'sarif,json'.
        required: false
        type: string
        default: sarif
      scan_path:
        description: >-
          Path (relative to the repository root) to scan. Defaults to
          '.' so the entire checkout is scanned; set to a subdirectory
          (e.g. 'src/' or 'services/api/') to restrict the scan to
          that subtree. The 'changed' scan mode further restricts to
          only the .py files modified inside this path. The path MUST
          exist after checkout or the scan job fails.
        required: false
        type: string
        default: "."
      severity_threshold:
        description: >-
          Minimum bandit severity that fails the job. Bandit always
          scans at LOW so the uploaded reports keep every finding;
          after the scan the script tallies findings by severity and
          fails the job only if any are at or above this threshold.
          Bandit categorises findings as LOW / MEDIUM / HIGH. Allowed
          values: 'low' (fail on any finding), 'medium', 'high'
          (default).
        required: false
        type: string
        default: high
# Deliberately no top-level `permissions:` block. A caller's permissions
# are an upper bound that a reusable workflow can only preserve or
# reduce, never elevate -- and a reusable workflow that itself requests
# a scope the caller didn't grant (e.g. `security-events: write`) makes
# the *entire call* fail at startup with "requesting X, but is only
# allowed X: none", not just skip the step that needed it (see
# https://github.com/ROCm/rocm-tests/pull/70). Permissions are
# intentionally left for each caller to define: PR-time callers that
# only request `report_formats: txt`/`json` need just `contents: read`;
# callers that request `report_formats: sarif` must additionally grant
# `security-events: write` on their own `uses:` job.

jobs:
  scan:
    name: Bandit scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # This job checks out *two* repos: this workflow's own repo (tooling:
      # bandit.py, bandit.yaml) at $GITHUB_WORKSPACE root, and the scan
      # target (the calling repo) into a side directory below. They can't
      # share the workspace root: actions/checkout wipes the *entire*
      # workspace the first time it checks out a path with no pre-existing
      # `.git` there (regardless of `clean:`), so whichever repo lands at
      # root has to be checked out exactly once and first.
      #
      # Tooling goes at root (not the scan target) because `uses: ./path`
      # local action/workflow references -- used elsewhere in this repo's
      # workflows -- resolve relative to $GITHUB_WORKSPACE on disk, not to
      # this repo automatically.
      - name: Checkout security-gh scan tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # job.workflow_repository / job.workflow_sha identify the repo
          # and exact commit that *this* reusable workflow file was called
          # at/from, regardless of which repo called it.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Checkout TheRock's github_actions_api helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gha_load_github_event/gha_set_output/gha_append_step_summary
          # are owned by TheRock, not duplicated here; sparse-checkout
          # keeps this fast since TheRock is a large repo and only this
          # one file is needed.
          repository: ROCm/TheRock
          # Pinned to a commit SHA, not a floating `main`: this job runs
          # with `security-events: write` on trusted/scheduled triggers,
          # so a floating ref would let any future TheRock `main` commit
          # -- unreviewed by us -- execute here. Bump deliberately by
          # reviewing the diff of `build_tools/github_actions/github_actions_api.py`
          # between the old and new SHA before updating this line.
          ref: 47947a1b1f93647eaf66963cc05ca2dfb1b65243 # 2026-08-13
          fetch-depth: 1
          sparse-checkout: |
            build_tools/github_actions/github_actions_api.py
          sparse-checkout-cone-mode: false
          path: .therock
          persist-credentials: false

      - name: Compute checkout fetch-depth
        id: depth
        run: python build_tools/github_actions/compute_pr_depth.py
        env:
          THEROCK_BUILD_TOOLS_DIR: ${{ github.workspace }}/.therock/build_tools

      - name: Checkout scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.depth.outputs.value }}
          path: .scan-target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run bandit
        id: scan
        env:
          BANDIT_SCAN_MODE: ${{ inputs.scan_mode }}
          BANDIT_REPORT_FORMATS: ${{ inputs.report_formats }}
          BANDIT_SOURCE_DIR: .scan-target/${{ inputs.scan_path }}
          BANDIT_CHECKOUT_ROOT: .scan-target
          BANDIT_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
          THEROCK_BUILD_TOOLS_DIR: ${{ github.workspace }}/.therock/build_tools
        run: python security_scanners/github_actions/bandit.py

      - name: Upload SARIF report to code scanning
        if: always() && steps.scan.outputs.sarif_path != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif_path }}
          category: bandit

      - name: Upload non-SARIF reports
        if: always() && steps.scan.outputs.non_sarif_paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: ${{ steps.scan.outputs.non_sarif_paths }}
          if-no-files-found: ignore
