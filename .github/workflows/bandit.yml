name: Bandit

on:
  workflow_call:
    inputs:
      scan_mode:
        description: >-
          'changed' (default) scans only Python files modified by the
          calling event (PR commits or push range). 'all' scans every
          .py file under 'scan_path' recursively.
        required: false
        type: string
        default: changed
      report_formats:
        description: >-
          Comma-separated list of bandit report formats to produce.
          Allowed values: 'sarif' (default), 'json', 'csv', 'html',
          'xml', 'yaml', 'txt'. SARIF outputs are uploaded to GitHub
          code scanning via github/codeql-action/upload-sarif; all
          other formats are uploaded as build artifacts via
          actions/upload-artifact. Example: 'sarif,json'.
        required: false
        type: string
        default: sarif
      scan_path:
        description: >-
          Path (relative to the repository root) to scan. Defaults to
          '.' so the entire checkout is scanned; set to a subdirectory
          (e.g. 'src/' or 'services/api/') to restrict the scan to
          that subtree. The 'changed' scan mode further restricts to
          only the .py files modified inside this path. The path MUST
          exist after checkout or the scan job fails.
        required: false
        type: string
        default: "."
      severity_threshold:
        description: >-
          Minimum bandit severity that fails the job. Bandit always
          scans at LOW so the uploaded reports keep every finding;
          after the scan the script tallies findings by severity and
          fails the job only if any are at or above this threshold.
          Bandit categorises findings as LOW / MEDIUM / HIGH. Allowed
          values: 'low' (fail on any finding), 'medium', 'high'
          (default).
        required: false
        type: string
        default: high
# Deliberately no top-level `permissions:` block. A caller's permissions
# are an upper bound that a reusable workflow can only preserve or
# reduce, never elevate -- and a reusable workflow that itself requests
# a scope the caller didn't grant (e.g. `security-events: write`) makes
# the *entire call* fail at startup with "requesting X, but is only
# allowed X: none", not just skip the step that needed it (see
# https://github.com/ROCm/rocm-tests/pull/70). Permissions are
# intentionally left for each caller to define: PR-time callers that
# only request `report_formats: txt`/`json` need just `contents: read`;
# callers that request `report_formats: sarif` must additionally grant
# `security-events: write` on their own `uses:` job.

jobs:
  scan:
    name: Bandit scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout security-gh scan tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      # Set up before any step that runs a scanner script, so the version
      # is pinned here rather than inherited from the runner image.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compute checkout fetch-depth
        id: depth
        run: python -m security_scanners.utils.compute_pr_depth

      - name: Checkout scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.depth.outputs.value }}
          path: .scan-target
          persist-credentials: false

      - name: Run bandit
        id: scan
        env:
          BANDIT_SCAN_MODE: ${{ inputs.scan_mode }}
          BANDIT_REPORT_FORMATS: ${{ inputs.report_formats }}
          BANDIT_SOURCE_DIR: .scan-target/${{ inputs.scan_path }}
          BANDIT_CHECKOUT_ROOT: .scan-target
          BANDIT_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
        run: python -m security_scanners.github_actions.bandit

      - name: Upload SARIF report to code scanning
        if: always() && steps.scan.outputs.sarif_path != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif_path }}
          category: bandit

      - name: Upload non-SARIF reports
        if: always() && steps.scan.outputs.non_sarif_paths != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: ${{ steps.scan.outputs.non_sarif_paths }}
          if-no-files-found: ignore
