#
# Weekly gitleaks scan: runs on a fixed cadence and pushes
# SARIF findings to the repository's code-scanning Security tab.
name: Gitleaks main

on:
  # Run every Saturday at 10:00 UTC.
  schedule:
    - cron: "0 10 * * 6"
  # Allow re-running the weekly scan on demand, e.g. after
  # tweaking `gitleaks.toml` or rotating the gitleaks version pin, so
  # the Security tab can be refreshed without an unrelated commit.
  workflow_dispatch:

jobs:
  gitleaks:
    uses: ./.github/workflows/gitleaks.yml
    with:
      scan_mode: all
      report_formats: sarif
    secrets:
      # Mints a short-lived, security-events-scoped installation token so
      # findings reach Security -> Code scanning without granting this
      # workflow's own GITHUB_TOKEN any elevated permissions.
      GH_APP_SECURITY_GH_CID: ${{ secrets.GH_APP_SECURITY_GH_CID }}
      GH_APP_SECURITY_GH_PRIVATE_KEY: ${{ secrets.GH_APP_SECURITY_GH_PRIVATE_KEY }}
