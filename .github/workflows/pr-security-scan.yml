#
# Pre-commit security gate: fast, PR-side security scanners that run on
# every pull request. Scanner selection and policy are defined by this
# repository's `security-baseline.yml` reusable workflow.
#
# Requests human-readable reports only: findings are uploaded as a build
# artifact and printed to the job summary, never to the Security tab, so
# fork PRs (which never receive elevated tokens) behave identically to
# same-repo PRs. See the scheduled counterpart (weekly-security-scan.yml)
# for the SARIF / code-scanning upload.

name: Security scan (PR)

on:
  pull_request:
    # Spelled out the default to avoid confusion.
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    # CodeQL is included by the baseline and discovers supported languages.
    # Artifact and PR access let the baseline update its findings comment.
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: $/.github/workflows/security-baseline.yml
    with:
      report_formats: human
      bandit_config_path: .github/scan_tools_configs/bandit.yml
      gitleaks_config_path: .github/scan_tools_configs/gitleaks.toml
      trivy_config_path: .github/scan_tools_configs/trivy.yml
      zizmor_config_path: .github/scan_tools_configs/zizmor.yml
