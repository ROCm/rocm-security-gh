#
# Weekly security scan: runs on a fixed cadence and pushes SARIF findings
# to the repository's code-scanning Security tab. Complements
# `pr-security-scan.yml`, which scans only what changed in a PR and
# uploads reviewer-readable artifacts for in-review browsing.

name: Weekly security scan

on:
  # Run every Saturday at 10:00 UTC.
  schedule:
    - cron: "0 10 * * 6"
  # Allow re-running the weekly scan on demand, e.g. after tweaking a
  # scanner's config or rotating its version pin, so the Security tab can
  # be refreshed without an unrelated commit.
  workflow_dispatch:

# Read-only by default, so a job added here later has to ask for more
# rather than inherit the repository's default token scope.
permissions:
  contents: read

jobs:
  security:
    # Only the job that uploads SARIF gets write access to code scanning.
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-baseline.yml
    with:
      scan_mode: all
      report_formats: sarif
