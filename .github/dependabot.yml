# Dependabot version updates. See
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; composite actions keep their own `uses:`
    # pins, so .github/actions has to be listed separately to get bumped.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # A week's delay after each release gives a compromised or broken
    # version time to be reported and pulled before it is proposed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # Hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      pre-commit:
        patterns:
          - "*"
