# trivy configuration for rocm-security-gh
# Reference: https://trivy.dev/latest/docs/references/configuration/config-file/
#
# Shared across every repo this config scans (this is the single
# trivy.yaml used by the `trivy.yml` reusable workflow for all
# callers, not just this repo). Add per-repo suppressions or tuning
# here (e.g. `vulnerability.ignore-unfixed`) so they stay centrally
# reviewable.

scan:
  skip-dirs:
    - .git
    - .venv
    - venv
    - build
    - dist
    - node_modules
